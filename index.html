const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function abrir(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(D.sal), iterations: D.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(D.iv) }, llave, u8(D.c)));
  try { sessionStorage.setItem("pres-clave", clave); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const guardada = (() => { try { return sessionStorage.getItem("pres-clave"); } catch (e) { return null; } })();
