<style>
  :root{--papel:#F5F3EF;--tinta:#0A1F2E;--tenue:#536873;--linea:#D9D3C5;--error:#B81730}
  *{box-sizing:border-box} html,body{height:100%;margin:0}

  p{margin:0;color:var(--tenue)}
  form{display:flex;gap:10px} input{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--tenue);border-radius:6px;background:#FBFAF6;color:var(--tinta)}
  button{font:600 15px/1 'IBM Plex Sans',sans-serif;padding:12px 18px;border:0;border-radius:6px;background:var(--tinta);color:var(--papel);cursor:pointer}

</style></head>
